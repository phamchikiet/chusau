<div class="p-4 lg:w-full max-w-2xl mx-auto grid lg:grid-cols-2 grid-cols-1 gap-3">
    <div class="col-span-2 flex flex-row items-center justify-center space-x-3"><span>Xin Chào {{Detail.Hoten}}</span>
      <button mat-flat-button color="primary" (click)="Logout()">Đăng Xuất</button>
    </div>
    <div class="lg:col-span-1 col-span-2 flex flex-col space-y-3 p-4">
        <span class="text-2xl font-bold text-center">Thông Tin Tài Khoản</span>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Họ Tên</mat-label>
        <input type="text" [(ngModel)]="Detail.Hoten" [ngModelOptions]="{standalone: true}" matInput
          class="w-full px-3 py-2 border border-gray-200 rounded" [placeholder]="'Họ Tên'" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Số Điện Thoại</mat-label>
        <input type="text" [(ngModel)]="Detail.SDT" [ngModelOptions]="{standalone: true}" matInput
          class="w-full px-3 py-2 border border-gray-200 rounded" [placeholder]="'Số Điện Thoại'" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Email</mat-label>
        <input type="text" [(ngModel)]="Detail.email" [ngModelOptions]="{standalone: true}" matInput
          class="w-full px-3 py-2 border border-gray-200 rounded" [placeholder]="'Email'" />
      </mat-form-field>
      @if(!Detail.id){
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Mật Khẩu</mat-label>
          <input type="password" [(ngModel)]="Detail.password" [ngModelOptions]="{standalone: true}" matInput
            class="w-full px-3 py-2 border border-gray-200 rounded" [placeholder]="'Mật Khẩu'" />
        </mat-form-field>
      }
      <div>
        <button mat-flat-button color="primary" (click)="Update()">Cập Nhật</button>
      </div>

    </div>
    <div class="lg:col-span-1 col-span-2 flex flex-col space-y-3 p-4">
        <span class="text-2xl font-bold text-center">Đổi Mật Khẩu</span>
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Mật Khẩu Hiện Tại</mat-label>
            <input type="password" [(ngModel)]="Detail.oldpass" [ngModelOptions]="{standalone: true}" matInput
                class="w-full px-3 py-2 border border-gray-200 rounded" [placeholder]="'Mật Khẩu Hiện Tại'" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Mật Khẩu Mới</mat-label>
            <input type="password" [(ngModel)]="Detail.newpass" [ngModelOptions]="{standalone: true}" matInput
                class="w-full px-3 py-2 border border-gray-200 rounded" [placeholder]="'Mật Khẩu Mới'" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Xác Nhận Mật Khẩu Mới</mat-label>
            <input type="password" [(ngModel)]="Detail.confirmnewpass" [ngModelOptions]="{standalone: true}" matInput
                class="w-full px-3 py-2 border border-gray-200 rounded" [placeholder]="'Xác Nhận Mật Khẩu Mới'" />
        </mat-form-field>
        <div>
            <button mat-flat-button color="primary" (click)="changePassword()">Đổi Mật Khẩu</button>
        </div>

    </div>

  </div>
